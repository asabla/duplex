# Linux Docker Engine. The NFS port is available only on the Docker host.
services:
  duplex:
    image: ghcr.io/asabla/duplex:latest
    command: [serve, --config, /state/config.yaml, --nfs-listen, "0.0.0.0:2049"]
    user: "10001:10001"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ports:
      - 127.0.0.1:${DUPLEX_PORT:-8765}:8765
      - 127.0.0.1:${DUPLEX_NFS_PORT:-2049}:2049
    volumes:
      - duplex-state:/state
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, /usr/local/bin/duplex, health]
      interval: 5s
      timeout: 6s
      retries: 12

volumes:
  duplex-state:
