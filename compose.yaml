# Run scripts/prepare-host.sh on the Linux Docker daemon host first.
# Docker Desktop/macOS mounts are not a replacement for a Colima Linux path.
services:
  duplex-mount:
    image: ghcr.io/asabla/duplex:latest
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    devices:
      - /dev/fuse:/dev/fuse
    cap_drop: [ALL]
    cap_add: [SYS_ADMIN]
    security_opt:
      - apparmor=unconfined
      - no-new-privileges:true
    ports:
      - 127.0.0.1:${DUPLEX_PORT:-8765}:8765
    volumes:
      - type: bind
        source: ${DUPLEX_HOST_DIR:-/var/lib/duplex}
        target: /state
        bind:
          propagation: rshared
          create_host_path: false
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, /usr/local/bin/duplex, health]
      interval: 10s
      timeout: 6s
      retries: 6
