# Run scripts/prepare-host.sh on the Linux Docker daemon host first.
# Docker Desktop/macOS mounts are not a replacement for a Colima Linux path.
services:
  mount-helper:
    image: ghcr.io/asabla/duplex:latest
    command: [mount-helper]
    user: "0:0"
    restart: unless-stopped
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    cap_add: [SYS_ADMIN]
    devices:
      - /dev/fuse:/dev/fuse
    security_opt:
      - apparmor=duplex-mount-helper
      - no-new-privileges:true
    volumes:
      - mount-control:/run/duplex
      - type: bind
        source: ${DUPLEX_HOST_DIR:-/var/lib/duplex}/library
        target: /library
        bind:
          propagation: rshared
          create_host_path: false
    healthcheck:
      test: [CMD, /usr/bin/test, -S, /run/duplex/mount.sock]
      interval: 2s
      timeout: 2s
      retries: 10
    stop_grace_period: 10s

  duplex-mount:
    image: ghcr.io/asabla/duplex:latest
    command: [serve, --config, /state/config.yaml, --mount-socket, /run/duplex/mount.sock]
    user: "10001:10001"
    depends_on:
      mount-helper:
        condition: service_healthy
        restart: true
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ports:
      - 127.0.0.1:${DUPLEX_PORT:-8765}:8765
    volumes:
      - mount-control:/run/duplex:ro
      - type: bind
        source: ${DUPLEX_HOST_DIR:-/var/lib/duplex}
        target: /state
        bind:
          propagation: rslave
          create_host_path: false
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, /usr/local/bin/duplex, health]
      interval: 10s
      timeout: 6s
      retries: 6

  # Claim this server and configure a dedicated Plex NFO Series TV library.
  # Save that library section and a protected token file in duplex settings.
  plex:
    image: plexinc/pms-docker@sha256:01bdf0ad6d53198da4331540c1e73ab65db7a72e961fff97ecb0847d46055c5f
    restart: unless-stopped
    depends_on:
      duplex-mount:
        condition: service_healthy
        restart: true
    ports:
      - 127.0.0.1:${PLEX_PORT:-32499}:32400
    environment:
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - plex-config:/config
      - plex-transcode:/transcode
      - type: bind
        source: ${DUPLEX_HOST_DIR:-/var/lib/duplex}/library
        target: /data
        read_only: true
        bind:
          propagation: rslave
          create_host_path: false
volumes:
  mount-control:
  plex-config:
  plex-transcode:
