# Linux Docker Engine. The NFS port is available only on the Docker host.
services:
  duplex:
    image: ghcr.io/asabla/duplex:latest
    command: [serve, --config, /state/config.yaml, --nfs-listen, "0.0.0.0:2049"]
    user: "10001:10001"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ports:
      - 127.0.0.1:${DUPLEX_PORT:-8765}:8765
      - 127.0.0.1:${DUPLEX_NFS_PORT:-2049}:2049
    volumes:
      - duplex-state:/state
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, /usr/local/bin/duplex, health]
      interval: 5s
      timeout: 6s
      retries: 12

  plex:
    image: plexinc/pms-docker@sha256:01bdf0ad6d53198da4331540c1e73ab65db7a72e961fff97ecb0847d46055c5f
    restart: unless-stopped
    depends_on:
      duplex:
        condition: service_healthy
    ports:
      - 127.0.0.1:${PLEX_PORT:-32499}:32400
    environment:
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - plex-config:/config
      - plex-transcode:/transcode
      - type: volume
        source: duplex-library
        target: /data/media
        read_only: true
        volume:
          nocopy: true

volumes:
  duplex-state:
  plex-config:
  plex-transcode:
  duplex-library:
    driver: local
    driver_opts:
      type: nfs
      device: :/media
      o: addr=127.0.0.1,port=${DUPLEX_NFS_PORT:-2049},mountport=${DUPLEX_NFS_PORT:-2049},nfsvers=3,tcp,mountproto=tcp,nolock,noacl,ro,hard,timeo=600,retrans=2
