version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - cyclop
    - durationcheck
    - errcheck
    - errorlint
    - exhaustive
    - forcetypeassert
    - gocognit
    - gocritic
    - gosec
    - govet
    - ineffassign
    - noctx
    - nolintlint
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unused
    - wsl_v5
    - funlen
  settings:
    wsl_v5:
      default: default
      enable: [after-block]
    funlen:
      lines: -1
      statements: 40
    cyclop:
      max-complexity: 15
    gocognit:
      min-complexity: 20
    errcheck:
      check-type-assertions: true
      check-blank: true
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    presets: []
    rules:
      # Keep complete test scenarios together; production complexity is bounded.
      - path: _test\.go
        linters: [cyclop, gocognit, funlen]

formatters:
  enable: [gofumpt, goimports]
  settings:
    gofumpt:
      module-path: duplex
    goimports:
      local-prefixes: [duplex]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
