name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
      - name: Restore Go build caches
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.tool-versions', 'go.sum', '.golangci.yml') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.tool-versions', 'go.sum', '.golangci.yml') }}-
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2
      - name: Install system prerequisites
        run: ./scripts/install-ci-prerequisites.sh
      - name: Install pinned source check tools
        run: npm ci --ignore-scripts --prefix tools/readability
      - name: Check
        run: make check
      - name: Validate Compose examples
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.plex.yaml config --quiet
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: quality-evidence
          path: |
            .cache/coverage.out
            .cache/coverage-native.out
            .cache/*-linux.cover
            .cache/*-coverage-source
            .cache/format.diff
            .cache/markup/markup-validation.json
          if-no-files-found: error
          include-hidden-files: true
