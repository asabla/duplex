name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
      - name: Restore Go build caches
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.tool-versions', 'go.sum', '.golangci.yml') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.tool-versions', 'go.sum', '.golangci.yml') }}-
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2
      - name: Install system prerequisites
        run: ./scripts/install-ci-prerequisites.sh
      - name: Install pinned source check tools
        run: npm ci --ignore-scripts --prefix tools/readability
      - name: Check
        run: make check
      - name: Validate Compose examples
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.plex.yaml config --quiet
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: quality-evidence
          path: |
            .cache/coverage.out
            .cache/coverage-native.out
            .cache/*-linux.cover
            .cache/*-coverage-source
            .cache/format.diff
            .cache/markup/markup-validation.json
          if-no-files-found: error
          include-hidden-files: true

  image:
    name: Image (${{ matrix.arch }})
    needs: check
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=duplex
            org.opencontainers.image.description=YouTube channels in Plex
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}
      - name: Test unprivileged NFS runtime and legacy FUSE recovery
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          sudo modprobe fuse
          sudo modprobe nfs
          sudo sh scripts/test-image.sh "$IMAGE:sha-$GITHUB_SHA-$ARCH"
      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested architecture image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          ARCH: ${{ matrix.arch }}
        run: docker push "$IMAGE:sha-$GITHUB_SHA-$ARCH"

  publish:
    name: Publish image
    needs: image
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform tags
        run: |
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA" \
            --annotation 'index:org.opencontainers.image.description=YouTube channels in Plex' \
            --tag "$IMAGE:sha-$GITHUB_SHA" \
            --tag "$IMAGE:latest" \
            "$IMAGE:sha-$GITHUB_SHA-amd64" "$IMAGE:sha-$GITHUB_SHA-arm64"
          docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
