name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
      - name: Install controlled-media prerequisites
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Check
        run: make check
      - name: Validate production Compose
        run: docker compose config --quiet
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: quality-evidence
          path: |
            .cache/coverage.out
            .cache/format.diff
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
      - name: Install FUSE and media prerequisites
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y fuse3 ffmpeg
      - name: Linux qualification
        run: ./scripts/check-linux.sh
